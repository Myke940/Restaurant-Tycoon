<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --cream: #f5f0e8;
      --dark: #1a1a1a;
      --accent: #c8a96e;
      --muted: #6b6560;
    }

    body {
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }

    .auth-card {
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 400px;
    }

    .auth-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      color: var(--dark);
      margin-bottom: 0.3rem;
    }

    .auth-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: var(--accent);
      margin-bottom: 2rem;
    }

    .form-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .form-control {
      border: 1px solid #e0dbd2;
      border-radius: 2px;
      background: var(--cream);
      font-size: 0.9rem;
      padding: 0.65rem 0.9rem;
      color: var(--dark);
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: none;
      background: #fff;
    }

    .btn-auth {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 2px;
      padding: 0.75rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 1.5rem;
      transition: background 0.2s;
    }

    .btn-auth:hover { background: #b8945a; color: #fff; }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.83rem;
      color: var(--muted);
    }

    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Log in to your account</div>
    <div class="divider"></div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="your username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="your password" required>
      </div>
      <button type="submit" class="btn btn-auth">Log in</button>
    </form>
    <div class="auth-footer">
      Don't have an account? <a href="{% url 'signin' %}">Sign up</a>
    </div>
  </div>
</body>
</html>
