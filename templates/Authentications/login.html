<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
</head>
<body>
    <form method = post>
        {% csrf_token %}
        <div>
            <p>Log in</p>
            <input type = "text" placeholder = "username" name = "username"> 
            <input type = "password" placeholder = "-------------" name = password> 
            <button type = "submit">Log in</button>
        </div>



    </form>
</body>
</html>
